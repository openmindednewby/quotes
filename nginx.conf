server {
    listen 0.0.0.0:80;
    listen [::]:80;
    server_name  localhost;

    # The access log already records each 404 with its URI; the error-log
    # "open() ... failed" line for the missing file duplicated it.
    log_not_found off;

    # Never serve dot-paths (.git/, .env, ...): /.git/HEAD was public, exposing
    # the repo history. 404, not 403, so existence is not disclosed. Must stay
    # the FIRST regex location (nginx takes the first regex that matches).
    # /.well-known/ stays reachable (ACME, security.txt).
    location ~ /\.(?!well-known) {
        return 404;
    }

    location / {
        root   /webgl;
        index  index.html;
    }

    # HTML entry must NEVER be cached: revalidate every load so a redeploy is
    # picked up on the next navigation (the no-service-worker auto-update fix).
    # Static SPA — asset filenames are NOT content-hashed, so do NOT add any
    # immutable caching here (that would silently serve stale builds).
    location ~* \.html$ {
        root   /webgl;
        add_header Cache-Control "no-cache";
    }

    # Custom 404 page. `internal` stops /404.html itself being served as a 200;
    # error_page keeps the original status, so missing paths still return 404.
    location = /404.html {
        root   /webgl;
        internal;
        add_header Cache-Control "no-cache" always;
    }

    error_page  404              /404.html;

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}